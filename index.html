    <!-- Suppress benign Vite HMR WebSocket connection errors behind sandbox reverse proxy -->
    <script>
      (function() {
        var isViteWsError = function(err) {
          if (!err) return false;
          var msg = (typeof err === 'string' ? err : err.message || err.reason || err.toString?.() || '').toLowerCase();
          return msg.indexOf('websocket') !== -1 || msg.indexOf('ws://') !== -1 || msg.indexOf('wss://') !== -1 || msg.indexOf('[vite]') !== -1;
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (isViteWsError(event.reason)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isViteWsError(event.error) || isViteWsError(event.message)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
